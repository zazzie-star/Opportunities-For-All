<!-- added notes for all the tags to help me remember :D -->

<!-- tells browser the file is written in modern html -->
<!DOCTYPE html>

<!-- the html tag = root tag of html, doc should ALWAYS start and end with this -->
<html> 

    <!-- used for storing info not directly visible on the webpage -->
    <head>
        
        <!-- link to the css file -->
        <link rel="stylesheet" href="style.css">

        <!-- the text which appears on a browser tab -->
        <title>
            Opportunities for All
        </title>

    </head>


    <!-- main content visble on wepage should go here -->
    <body>

        <!-- div tag is a container tag for grouping elements -->
        <!-- class tag = to style one or many elements similarly (.classname)-->
        <!-- id tag = for a specific/unique element on a web page/link to js (#idname) -->
        <div class="panel">

            <!-- header tag is the top part of the website -->
            <header>

                <!-- nav tag keeps the navigation links! -->
                <nav>
                    <!-- creates a link that jumps to the section with the relevent #id -->
                    <a href="#about">About</a>
                    <a href="#projects">Projects</a>
                </nav>

                <!-- header tag for dif sizes -->
                 <h1 class="a"> 
                    Opportunities <br>
                    For <strong> ALL </strong>
                </h1>
                
                
            </header>

            
            <!-- p tag used to start a new para -->
            <p>
                Opportunities for all is a website where you can browse any and all opportunity (for all your linkdin-maxxing needs!)
            </p>

        </div>


        <div>
            
            <!-- section groups related content together -->
            <!-- id="blahblahblah" gives that section a name so the navbar can link to it -->
            <section id="about">
                <h2>About Me</h2>
                <p>Write a short intro about yourself here.</p>
            </section>
            
            <section id="projects">
                <h2>Projects</h2>
                <p>Add your projects here.</p>
            </section>

            <!-- for adding links -->
            <a href=""> Hack Club </a>
            
            <!-- img-image, src-tells browser where img file is, alt-describes img if it doesn't load -->
            <img src="" alt=" Hack Club Logo">

        </div>




    </body>


</html>
